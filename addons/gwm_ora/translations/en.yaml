configuration:
  country:
    name: Country
    description: Two-letter account registration country, for example DE, GB, AU, NZ, RU, or CN. It must match the country used when the account was created.
  region:
    name: Region / cloud gateway
    description: GWM cloud region to connect to. Use eu for Europe/Israel, aus for Australia/New Zealand, rus for Russia, or experimental cn for mainland China.
  username:
    name: Username
    description: GWM account e-mail address, or the registered phone number when region is cn.
  password:
    name: Password
    description: Password used for eu, aus, and rus accounts. Ignored when region is cn.
  verification_code:
    name: Verification code
    description: One-time SMS or e-mail code requested by GWM. China login always uses an SMS code; leave empty first so the add-on can request it.
  security_pin:
    name: Security PIN
    description: Optional 6-digit vehicle remote control PIN from the official app. Required for remote commands except in the experimental China region.
  enable_remote_commands:
    name: Enable remote commands
    description: Allow Home Assistant to send vehicle remote commands through this add-on.
  enable_charging_control:
    name: Enable charging control
    description: Allow Home Assistant to write the vehicle charging schedule through this add-on.
  poll_interval_seconds:
    name: Poll interval
    description: Number of seconds between GWM cloud status polls.
  log_level:
    name: Log level
    description: Minimum log level for the add-on service.
network:
  8099/tcp: Internal API for the GWM custom integration.
