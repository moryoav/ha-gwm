configuration:
  country:
    name: Country
    description: Two-letter account registration country, for example DE, GB, AU, or NZ. It must match the country used when the account was created.
  region:
    name: Region / cloud gateway
    description: GWM cloud region to connect to. Use eu for Europe/Israel accounts or aus for Australia/New Zealand accounts.
  username:
    name: Username
    description: E-mail address used for the GWM ORA account.
  password:
    name: Password
    description: Password used for the GWM ORA account.
  verification_code:
    name: Verification code
    description: Optional one-time SMS or e-mail code requested by GWM when the add-on device is not trusted yet. Leave empty unless the add-on log asks for it.
  security_pin:
    name: Security PIN
    description: Optional 6-digit vehicle remote control PIN from the official app. Required for A/C, lock, unlock, and close-window commands.
  enable_remote_commands:
    name: Enable remote commands
    description: Allow Home Assistant to send vehicle remote commands through this add-on. Australia/New Zealand command support is experimental and unconfirmed.
  poll_interval_seconds:
    name: Poll interval
    description: Number of seconds between GWM cloud status polls.
  log_level:
    name: Log level
    description: Minimum log level for the add-on service.
network:
  8099/tcp: Internal API for the GWM ORA custom integration.
