name: GWM
version: "0.12.0"
slug: gwm_ora
description: Native Home Assistant add-on for GWM vehicles
url: https://github.com/moryoav/ha-gwm
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
hassio_api: true
discovery:
  - gwm_ora
ingress: true
ingress_port: 8099
panel_icon: mdi:car
panel_title: GWM
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Internal API for the GWM custom integration
options:
  country: DE
  region: eu
  username: ""
  password: ""
  enable_remote_commands: false
  enable_charging_control: false
  poll_interval_seconds: 60
  log_level: info
schema:
  country: "match(^[A-Za-z]{2}$)"
  region: "list(eu|aus|rus|cn)"
  username: str
  password: password
  verification_code: password?
  security_pin: password?
  enable_remote_commands: bool
  enable_charging_control: bool
  poll_interval_seconds: "int(30,3600)"
  log_level: "list(trace|debug|info|warning|error)"
environment:
  ASPNETCORE_HTTP_PORTS: "8099"
  GWM_ORA_ADDON_VERSION: "0.12.0"
