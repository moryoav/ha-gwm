name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install cryptography homeassistant pytest pytest-asyncio ruff
      - run: ruff check gwm_ora_client custom_components tests/python
      - run: pytest tests/python
